[tracing]
level = "debug"

[http]
address = "0.0.0.0:3000"

[fflogs]
url = "https://www.fflogs.com/v1/"
# key = "XIVA_FFLOGS_KEY"

[fflogs.limit]
# Limit to 4 requests per minute. Navigating to an analysis typically takes 2
# requests, so we're allowing for 5x that to be extra safe.
burst = 10
recover_secs = 15

[xivapi]
url = "https://beta.xivapi.com/api/1/"

[client]
public_path = "public"
default_branch = "dawntrail"
